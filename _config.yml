# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: Richard Liao - Engineering Portfolio # This is what shows up in the tab of the browser



# Hero Section
name: Richard Liao
headline: Mechanical Engineering @ University of Waterloo
description: >- # dont remove this line. this will ignore all new lines until the next section
  Hello! I'm Richard, a passionate first-year mechanical engineering student. I have a solid foundation of experience with AutoCAD and SolidWorks and I'm always willing to learn and adapt!
  I am currently seeking a 4-month co-op position for the upcoming winter term to apply my engineering knowledge to real-world challenges and to produce tangible impact.

# Place your profile image in /assets/images/profile-image/folder and edit the file name
profile_image: /assets/images/profile-image/richard.jpg


# Link your resume
# You can place your resume in assets/resume/{resume.pdf or add external link such as pdf saved in google drive
# Tip: avoid spaces in the file name (e.g. richard-liao-resume.pdf) so the link never breaks.
resume-url: /assets/resume/RICHARD LIAO - Resume F26 V1.pdf # or /assets/resume/resume.pdf


# Set up external links - this will show up as small icons next to your name.
# Input ONLY your url slug (the last part of your profile URL), not the full link.
# The icons with missing entries will not appear.

external-links:
  linkedin: richardliaomx          # https://www.linkedin.com/in/{your url slug}
  github: richard-liao12           # https://github.com/{your url slug}
  stackoverflow:                   # https://stackoverflow.com/users/{your url slug}
  medium:                          # https://medium.com/@{your url slug}
  x-twitter:                       # https://x.com/{your url slug}
  threads:                         # https://threads.net/@{your url slug}
  instagram:                       # https://instagram.com/{your url slug}
  youtube:                         # https://youtube.com/@{your url slug}
  discord:                         # https://discord.com/users/{your url slug}
  bluesky:                         # https://bsky.app/profile/{your url slug}


# Skills Section - Add the list of your Skills by categories/tools. The indentation for each level needs to be precise.
skills:
  - category: CAD
    tools:
    - AutoCAD
    - SolidWorks 2026
  - category: Programming
    tools:
    - Python
    - Java
  - category: Simulations
    tools:
    - FEA


# Contact Form Setup. Create a free Formspree form and paste ONLY the form ID here
# (the part after https://formspree.io/f/). The site adds the rest of the URL.
formspree-key: YOUR_FORM_ID



# Active theme (Update this to switch themes). Make sure to keep the indentation the same.
# Active: "Slate & Teal" - ink navy text, cool paper background, deep teal accent.
colors:
  text: "#0d1b2a"
  border: "#d9e1e8"
  link: "#0f766e"
  highlight: "#0a5c56"
  background: "#f6f8fa"
  light_background: "#e4f2f0"

# Alternative themes. Copy any block's values into `colors:` above to switch.
# (These are reference only - the site does not read them.)
themes:
  slate-teal:        # the active theme above
    text: "#0d1b2a"
    border: "#d9e1e8"
    link: "#0f766e"
    highlight: "#0a5c56"
    background: "#f6f8fa"
    light_background: "#e4f2f0"

  slate-indigo:
    text: "#111827"
    border: "#dcdfe8"
    link: "#4338ca"
    highlight: "#312e81"
    background: "#f7f8fb"
    light_background: "#e9eafc"

  graphite-amber:
    text: "#1c1f24"
    border: "#e0e0dc"
    link: "#b45309"
    highlight: "#92400e"
    background: "#f8f8f6"
    light_background: "#fbefd9"

  original:
    text: "#1a1c20"
    border: "#ddd"
    link: "#4a76ee"
    highlight: "#0c0cf2"
    background: "#ffffff"
    light_background: "#f3f5fb"






#########################################################################################################
# Build settings for the site. Editing the below may cause the site to malfunction.

collections:
  projects:
    output: true
    permalink: /projects/:path/


markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
      indent: 0

plugins:
  - jekyll-feed

include:
  - _projects


